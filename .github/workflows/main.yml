name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kintsugi-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kintsugi_deploy
          chmod 600 ~/.ssh/kintsugi_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/kintsugi_deploy \
            deploy@"$SSH_HOST" \
            sudo -n /usr/local/sbin/deploy-kintsugi-backend
